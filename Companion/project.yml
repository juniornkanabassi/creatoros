name: CreatorOSCompanion
options:
  bundleIdPrefix: com.juniornkanabassi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: M6L2VW4W5Z
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  CreatorOS:
    type: application
    platform: iOS
    sources: [App, Shared, ../Sources/SocialsCore]
    dependencies:
      - target: SocialsWidget
    entitlements:
      path: App/CreatorOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.juniornkanabassi.creatoros]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.juniornkanabassi.creatoros.shared"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CreatorOS
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juniornkanabassi.CreatorOS.Companion
  SocialsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared, ../Sources/SocialsCore]
    entitlements:
      path: Widget/SocialsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.juniornkanabassi.creatoros]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.juniornkanabassi.creatoros.shared"]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Socials
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juniornkanabassi.CreatorOS.Companion.SocialsWidget
  CreatorOSCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared, ../Sources/SocialsCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juniornkanabassi.CreatorOS.Companion.Tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CreatorOS:
    build:
      targets:
        CreatorOS: all
    test:
      targets: [CreatorOSCompanionTests]
