# Source checks on every pull request, including every light/dark page and layout/grid gate.
# Unsigned, no secrets, read-only token, synthetic data only; nothing is signed, released, published or installed.
# build.sh, release.sh, install.sh and the checks that need a packaged app stay on the Mac.
name: Fast checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-26   # tested on macOS 26 with the macOS 26 SDK
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Offscreen source, snapshot and layout gates
        env:
          CREATOROS_TEST_SCRATCH: ${{ runner.temp }}/creatoros-build
          SNAPSHOT_OUTPUT: ${{ runner.temp }}/creatoros-snapshots
        run: zsh test.sh --source-only
      - name: Retain light and dark snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatoros-snapshots
          path: ${{ runner.temp }}/creatoros-snapshots
          if-no-files-found: error
